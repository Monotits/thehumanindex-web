name: oecd-snapshot
# OECD (HTTP 500) and IMF (HTTP 403) block Vercel egress IPs. Fetch here, commit JSON; the crons read it.
on:
  schedule:
    - cron: '17 5 * * *'   # daily 05:17 UTC, before the 08:00 UTC Live cron
    - cron: '47 6 * * *'   # second try — OECD intermittently returns HTTP 500 to cloud IPs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: oecd-snapshot, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: OECD monthly
        run: node scripts/fetch-oecd-snapshot.mjs data/live/oecd-monthly.json
        continue-on-error: true
      - name: IMF WEO
        run: node scripts/fetch-imf-snapshot.mjs data/live/imf-weo.json
        continue-on-error: true
      - name: ERA5 temperature (World Bank CCKP)
        run: node scripts/fetch-climate-snapshot.mjs data/live/era5-temperature.json
        continue-on-error: true
      - name: Commit if changed
        run: |
          git add -N data/live/*.json
          if git diff --quiet -- data/live/; then
            echo "No new data."; exit 0
          fi
          # Commit as the repo owner so Vercel (Hobby) accepts the deployment.
          git config user.name "Bugra"
          git config user.email "experlercom@gmail.com"
          git add data/live/*.json
          git commit -m "data: OECD/IMF/ERA5 snapshot $(date -u +%F) [automated]"
          git push
